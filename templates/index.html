<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flask DevSecOps Pipeline</title>
    <style>
      :root {
        color-scheme: light;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #f6f8ff, #ecfdf5);
        color: #111827;
      }

      main {
        text-align: center;
        padding: 2rem;
        border-radius: 16px;
        background: #ffffff;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        max-width: 560px;
      }

      h1 {
        margin: 0 0 0.75rem;
        font-size: 2rem;
      }

      p {
        margin: 0;
        color: #374151;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>DevSecOps Pipeline Running</h1>
      <p>Flask app is healthy and serving template content.</p>
    </main>
  </body>
</html>
