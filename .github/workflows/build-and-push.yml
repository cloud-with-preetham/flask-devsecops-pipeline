name: Docker Build & Push

on:
  workflow_call:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      - name: Code Checkout
        uses: actions/checkout@v5

      - name: Login, Buildx setup, and Build & Push (with retries)
        env:
          DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USER }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail

          IMAGE_BASE="${DOCKERHUB_USER}/flask-devsecops-pipeline"
          echo "${DOCKERHUB_TOKEN}" | docker login -u "${DOCKERHUB_USER}" --password-stdin

          docker buildx create --name ci-builder --driver docker-container --use || docker buildx use ci-builder
          docker buildx inspect --bootstrap

          TAG_ARGS=(
            --tag "${IMAGE_BASE}:${GITHUB_REF_NAME}"
            --tag "${IMAGE_BASE}:latest"
            --tag "${IMAGE_BASE}:${GITHUB_SHA}"
          )

          for attempt in 1 2 3; do
            echo "Build and push attempt ${attempt}/3"
            if docker buildx build \
              --pull \
              --push \
              --cache-from type=gha \
              --cache-to type=gha,mode=max \
              "${TAG_ARGS[@]}" \
              .; then
              echo "Build and push succeeded"
              exit 0
            fi
            if [ "${attempt}" -lt 3 ]; then
              echo "Attempt ${attempt} failed, retrying after 20s..."
              sleep 20
            fi
          done

          echo "Build and push failed after 3 attempts"
          exit 1
