name: Deploy to Server

on:
  workflow_call:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy container over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            if ! command -v docker >/dev/null 2>&1; then
              sudo apt-get update -y
              sudo apt-get install -y docker.io
            fi
            sudo systemctl enable --now docker || true

            IMAGE="${{ secrets.DOCKERHUB_USER }}/github-actions-app:latest"
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | sudo docker login -u "${{ secrets.DOCKERHUB_USER }}" --password-stdin
            sudo docker pull "$IMAGE"
            sudo docker stop flask-devsecops-pipeline || true
            sudo docker rm flask-devsecops-pipeline || true
            sudo docker run -d \
              --name flask-devsecops-pipeline \
              --restart unless-stopped \
              -p 80:80 \
              "$IMAGE"
