name: Image Scanner

on:
  workflow_call:

jobs:
  scan-image:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build --pull --no-cache -t flask-devsecops-pipeline:${{ github.sha }} .

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: flask-devsecops-pipeline:${{ github.sha }}
          trivyignores: .trivyignore
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
